<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vamshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F1;
    --paper-raised:#FFFFFF;
    --ink:#231A33;
    --ink-soft:#6E6579;
    --line:#E6E0D2;
    --gold:#AD8422;
    --gold-soft:#F1E6C8;
    --berry:#A23F55;
    --berry-soft:#F3DEE2;
    --sidebar-w:240px;
    --panel-w:320px;
    --radius:3px;
  }
  html.dark{
    --paper:#1C1626;
    --paper-raised:#241D31;
    --ink:#F3EEE3;
    --ink-soft:#B1A7BE;
    --line:#3A314B;
    --gold:#D9B04C;
    --gold-soft:#3A3122;
    --berry:#D97C90;
    --berry-soft:#3A222A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  body,input,textarea,button{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  body{
    background:var(--paper);
    transition:background .25s ease, color .25s ease;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  a{color:inherit;text-decoration:none;}
  button{cursor:pointer;font:inherit;}
  ::selection{background:var(--gold-soft);}
  svg{width:20px;height:20px;flex:none;}

  /* ---------- APP SHELL ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--panel-w);
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    border-right:1px solid var(--line);
    padding:28px 18px;
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column;
  }
  .logo{
    font-size:26px;
    letter-spacing:.2px;
    margin:0 8px 34px;
  }
  .logo em{font-style:italic; color:var(--gold);}
  .navlist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px;}
  .navlist button{
    width:100%;
    display:flex; align-items:center; gap:14px;
    background:none; border:none;
    padding:11px 10px;
    border-radius:var(--radius);
    font-size:15.5px;
    text-align:left;
    color:var(--ink-soft);
  }
  .navlist button svg{width:21px;height:21px;flex:none;}
  .navlist button .lbl{display:inline;}
  .navlist button.active{ color:var(--ink); font-weight:600; }
  .navlist button.active svg{ stroke:var(--berry); }
  .navlist button:hover{background:var(--paper-raised);}
  .compose-btn{
    margin-top:22px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:13px 0;
    font-weight:600;
    font-size:15px;
  }
  html.dark .compose-btn{background:var(--gold); color:#1C1626;}
  .compose-btn:hover{opacity:.88;}
  .sidebar-foot{margin-top:auto; padding-top:18px;}
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line); border-radius:999px;
    padding:8px 12px; background:var(--paper-raised);
    font-size:13.5px; color:var(--ink-soft); width:100%;
    white-space:nowrap; overflow:hidden;
  }

  /* ---------- MAIN COLUMN ---------- */
  .main{border-right:1px solid var(--line); min-height:100vh; position:relative;}
  .topbar{
    position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 22px;
  }
  .topbar h1{
    font-family:'Fraunces', serif;
    font-size:20px; margin:0; font-weight:600;
  }
  .topbar p{margin:2px 0 0; font-size:13px; color:var(--ink-soft);}

  .composer{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:600; font-size:14px; flex:none; color:#fff;
    overflow:hidden; position:relative;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .composer-body{flex:1;}
  .composer textarea{
    width:100%; border:none; resize:none; background:none;
    font-size:16.5px; line-height:1.45; outline:none; min-height:52px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .composer textarea::placeholder{color:var(--ink-soft);}
  .composer-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .composer-count{font-size:12.5px; color:var(--ink-soft);}
  .composer-tools{display:flex; align-items:center; gap:10px;}
  .media-btn{
    background:none; border:1px solid var(--line); border-radius:999px;
    padding:7px 9px; color:var(--ink-soft); display:flex; align-items:center;
  }
  .media-btn:hover{color:var(--berry); border-color:var(--berry);}
  .media-preview{position:relative; margin-top:10px; max-width:320px;}
  .media-preview img, .media-preview video{width:100%; border-radius:var(--radius); border:1px solid var(--line); display:block; max-height:280px; background:#000;}
  .media-remove{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .upload-progress{margin-top:8px; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .upload-progress-bar{height:100%; background:var(--berry); transition:width .15s ease;}
  .upload-label{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .post-submit{
    background:var(--berry); color:#fff; border:none;
    border-radius:999px; padding:9px 20px; font-weight:600; font-size:14px;
  }
  .post-submit:disabled{opacity:.4; cursor:default;}

  /* ---------- FEED / POSTS ---------- */
  .feed{}
  .post{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px; animation:fade .35s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .post-main{flex:1; min-width:0;}
  .post-head{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
  .post-head .name{font-weight:600; font-size:15px;}
  .post-head .handle, .post-head .dot, .post-head .time{color:var(--ink-soft); font-size:13.5px;}
  .post-text{margin:5px 0 10px; font-size:15.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
  .post-media{border-radius:var(--radius); margin-bottom:10px; overflow:hidden; border:1px solid var(--line); background:#000; position:relative;}
  .post-media img, .post-media video{width:100%; max-height:520px; display:block; object-fit:contain; background:#000;}
  .post-actions{display:flex; gap:26px;}
  .act{
    display:flex; align-items:center; gap:7px;
    background:none; border:none; color:var(--ink-soft); font-size:13.5px;
  }
  .act svg{width:18px;height:18px;}
  .act:hover{color:var(--ink);}
  .act.liked{color:var(--berry);}
  .act.liked svg{fill:var(--berry); stroke:var(--berry);}

  .comments{margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:10px;}
  .comment{display:flex; gap:9px; font-size:14px;}
  .comment .name{font-weight:600; margin-right:6px;}
  .comment-form{display:flex; gap:9px; align-items:center; margin-top:2px;}
  .comment-form input{
    flex:1; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:13.5px; background:var(--paper-raised); outline:none;
  }
  .comment-form button{background:none; border:none; color:var(--berry); font-weight:600; font-size:13.5px;}

  /* ---------- SHORTS COMMENTS SHEET ---------- */
  .short-comments-sheet{
    background:var(--paper-raised); width:100%; max-width:460px; margin:0 auto;
    border-radius:16px 16px 0 0; max-height:72vh; display:flex; flex-direction:column;
    border:1px solid var(--line); border-bottom:none; animation:sheetUp .2s ease;
  }
  @keyframes sheetUp{from{transform:translateY(16px); opacity:.4;} to{transform:none; opacity:1;}}
  .short-comments-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line); flex:none;
  }
  .short-comments-head h3{margin:0; font-family:'Fraunces', serif; font-size:17px;}
  .short-comments-list{overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; flex:1;}
  .short-comments-sheet .comment-form{border-top:1px solid var(--line); padding:12px 16px; margin:0; flex:none;}

  /* ---------- MODAL / DIALOG ---------- */
  .modal-back{
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.3);
    display:flex; align-items:flex-end; justify-content:center; z-index:10; padding:16px;
  }
  .modal{
    background:var(--paper-raised); border-radius:8px; padding:20px; max-width:420px; width:100%;
    max-height:90vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 16px; font-size:18px; font-weight:600;}
  .modal label{display:block; font-size:13px; font-weight:600; margin:14px 0 6px; color:var(--ink);}
  .modal input, .modal textarea, .modal select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; font-size:14px; background:var(--paper); color:var(--ink);
    font-family:inherit; outline:none;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus{
    border-color:var(--berry); background:var(--paper-raised);
  }
  .modal-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
  .btn-solid{background:var(--berry); color:#fff; border:none; border-radius:4px; padding:10px 16px; font-weight:600; font-size:14px;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink); border-radius:4px; padding:10px 16px; font-weight:600; font-size:14px;}
  .modal-change-photo{background:var(--line); border:none; border-radius:var(--radius); padding:20px 10px; width:100%; font-weight:600; color:var(--ink);}

  /* ---------- CHECKBOX STYLES ---------- */
  .checkbox-row{display:flex; align-items:center; gap:10px; margin:12px 0;}
  .checkbox-row input[type="checkbox"]{width:18px; height:18px; cursor:pointer;}
  .checkbox-row label{margin:0; cursor:pointer; flex:1;}

  /* ---------- DOWNLOAD BUTTON ---------- */
  .download-btn{
    background:none; border:none; color:var(--ink-soft); font-size:13px;
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px;
  }
  .download-btn:hover{color:var(--berry);}
  .download-btn.downloading{opacity:0.6;}

  /* ---------- CALL MODAL ---------- */
  .call-modal{
    position:fixed; top:0; left:0; right:0; bottom:0; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100; color:#fff; font-family:'IBM Plex Sans', sans-serif;
  }
  .call-video{width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;}
  .call-info{
    position:relative; z-index:2; text-align:center; pointer-events:none;
  }
  .call-name{font-size:24px; font-weight:600; margin-bottom:8px;}
  .call-status{font-size:14px; color:rgba(255,255,255,0.7);}
  .call-controls{
    position:relative; z-index:2; display:flex; gap:16px; margin-top:40px;
    justify-content:center; align-items:center;
  }
  .call-btn{
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    transition:transform .2s;
  }
  .call-btn:hover{transform:scale(1.1);}
  .call-btn.accept{background:#4CAF50; color:#fff;}
  .call-btn.decline{background:#f44336; color:#fff;}
  .call-btn.mute{background:rgba(255,255,255,0.2); color:#fff;}
  .call-btn.speaker{background:rgba(255,255,255,0.2); color:#fff;}
  .call-duration{font-size:13px; color:rgba(255,255,255,0.7); margin-top:16px;}

  /* ---------- RIGHT PANEL ---------- */
  .panel{padding:26px 20px; display:flex; flex-direction:column; gap:26px;}
  .card{border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--paper-raised);}
  .profile-card .avatar{width:52px;height:52px;font-size:17px;margin-bottom:10px;}
  .profile-card h3{margin:0 0 2px; font-family:'Fraunces', serif; font-size:18px;}
  .profile-card p{margin:0 0 12px; font-size:13.5px; color:var(--ink-soft);}
  .stat-row{display:flex; gap:18px; font-size:13px;}
  .stat-row b{display:block; font-size:15px;}
  .card h4{margin:0 0 12px; font-size:13.5px; text-transform:none; letter-spacing:.2px; color:var(--ink-soft); font-weight:600;}
  .suggest-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .suggest-row .avatar{width:34px;height:34px;font-size:12px;}
  .suggest-row .who{flex:1; min-width:0;}
  .suggest-row .who .n{font-size:13.5px; font-weight:600;}
  .suggest-row .who .h{font-size:12px; color:var(--ink-soft);}
  .follow-btn{border:1px solid var(--ink); background:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600;}
  .follow-btn.following{background:var(--ink); color:var(--paper);}
  .trend{padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .trend:last-child{border:none;}
  .trend .tag{font-weight:600; display:block;}
  .trend .n{color:var(--ink-soft); font-size:12px;}

  /* ---------- VIEWS: PROFILE / EXPLORE / NOTIFS / MESSAGES ---------- */
  .profile-banner{height:120px; background:linear-gradient(120deg, var(--gold-soft), var(--berry-soft));}
  .profile-head{padding:0 22px 18px; margin-top:-34px;}
  .profile-head .avatar{width:84px;height:84px; font-size:26px; border:4px solid var(--paper); margin-bottom:10px;}
  .profile-head h2{font-family:'Fraunces', serif; margin:0 0 2px; font-size:23px;}
  .profile-head .handle{color:var(--ink-soft); font-size:14px;}
  .profile-head .bio{margin:12px 0; font-size:14.5px; line-height:1.5; max-width:480px;}
  .profile-stats{display:flex; gap:20px; font-size:13.5px; margin-bottom:14px;}
  .profile-stats b{color:var(--ink);}
  .edit-btn{border:1px solid var(--line); background:var(--paper-raised); border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:600;}
  .sign-out-btn{
    position:absolute; top:12px; right:14px;
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.35); color:#fff; border:1px solid rgba(255,255,255,.6);
    border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600;
    backdrop-filter:blur(4px);
  }
  .sign-out-btn svg{width:14px;height:14px;stroke:#fff;}
  .sign-out-btn:hover{background:rgba(0,0,0,.55);}

  .grid-simple{padding:20px 22px; display:grid; gap:14px;}
  .explore-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .explore-card .tag{font-family:'Fraunces', serif; font-size:17px; margin:0 0 4px;}
  .explore-card p{margin:0; font-size:13px; color:var(--ink-soft);}

  .notif{display:flex; gap:12px; padding:15px 22px; border-bottom:1px solid var(--line); align-items:flex-start;}
  .notif svg{width:20px;height:20px; flex:none; margin-top:2px; stroke:var(--berry);}
  .notif .t{font-size:14.5px;}
  .notif .time{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .notif.unread{background:var(--line);}
  .notif .n-avatar{position:relative; flex:none;}
  .notif .n-badge{position:absolute; right:-3px; bottom:-3px; width:18px;height:18px; border-radius:50%; background:var(--paper); display:flex; align-items:center; justify-content:center;}
  .notif .n-badge svg{width:11px;height:11px; margin:0; stroke:var(--gold);}

  .msg-thread{display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); cursor:pointer;}
  .msg-thread:hover{background:var(--line);}
  .msg-thread .who{flex:1; min-width:0;}
  .msg-thread .n{font-weight:600; font-size:14.5px;}
  .msg-thread .preview{font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .msg-thread .time{font-size:11.5px; color:var(--ink-soft); flex:none;}
  .msg-thread .call-indicator{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--berry);
    background:var(--berry-soft); padding:2px 6px; border-radius:999px; margin-left:4px;
  }

  .navlist button{position:relative;}
  .nav-badge{position:absolute; top:2px; left:18px; width:8px;height:8px; border-radius:50%; background:var(--berry);}
  .mobile-nav button{position:relative;}
  .mobile-nav .nav-badge{top:2px; right:8px; left:auto;}

  .convo-wrap{display:flex; flex-direction:column; min-height:70vh;}
  .convo-head{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line);}
  .convo-head button{background:none;border:none;cursor:pointer;color:var(--ink);padding:4px;display:flex;}
  .convo-head svg{width:22px;height:22px;}
  .convo-head .n{font-weight:600; font-size:15px;}
  .convo-head .h{font-size:12.5px; color:var(--ink-soft);}
  .convo-call-btn{background:var(--berry); color:#fff; border:none; border-radius:4px; padding:6px 12px; font-size:12px; cursor:pointer; margin-left:auto;}
  .convo-msgs{flex:1; max-height:55vh; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
  .convo-bubble{max-width:72%; padding:9px 13px; border-radius:16px; font-size:14px; line-height:1.4; word-wrap:break-word;}
  .convo-bubble.mine{align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:4px;}
  .convo-bubble.theirs{align-self:flex-start; background:var(--line); color:var(--ink); border-bottom-left-radius:4px;}
  .convo-bubble{cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;}
  .convo-bubble.deleted{font-style:italic; opacity:.6; cursor:default;}
  .convo-bubble.mine.deleted{background:var(--line); color:var(--ink-soft);}
  .msg-action-sheet{
    background:var(--paper-raised); width:100%; max-width:460px; margin:0 auto;
    border-radius:16px 16px 0 0; display:flex; flex-direction:column;
    border:1px solid var(--line); border-bottom:none; animation:sheetUp .2s ease;
    padding:8px 0 4px;
  }
  .msg-action-sheet button{
    background:none; border:none; text-align:left; padding:14px 20px; font-size:15px;
    color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);
  }
  .msg-action-sheet button:last-child{border-bottom:none;}
  .msg-action-sheet button.danger{color:var(--berry);}
  .msg-action-sheet button:hover{background:var(--line);}
  .convo-empty{margin:auto; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .convo-input{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line);}
  .convo-input input{flex:1; border:1px solid var(--line); border-radius:20px; padding:10px 16px; font-size:14px; background:var(--paper); color:var(--ink);}
  .convo-input button{flex:none; width:38px;height:38px; border-radius:50%; border:none; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .convo-input button svg{width:17px;height:17px;}
  .convo-input button:disabled{opacity:0.4; cursor:default;}
  .message-btn{margin-top:2px; margin-left:8px; padding:9px 18px; border-radius:20px; border:1px solid var(--line); background:none; color:var(--ink); font-size:13.5px; cursor:pointer;}

  .empty{padding:60px 22px; text-align:center; color:var(--ink-soft);}

  /* SHORTS */
  .shorts-wrap{display:flex;flex-direction:column;overflow-y:auto;scroll-snap-type:y mandatory;}
  .short{
    width:100%; aspect-ratio:9/16; position:relative; scroll-snap-align:start;
    display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;
  }
  .short video{width:100%;height:100%;object-fit:cover;}
  .short-mute{
    position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;
    background:rgba(0,0,0,.4);border:none;color:#fff;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);z-index:2;
  }
  .short-mute svg{width:20px;height:20px;}
  .short-overlay{
    position:absolute;bottom:0;left:0;right:0;padding:20px;
    background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;z-index:2;
  }
  .short-overlay .name{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;
  }
  .short-overlay .cap{font-size:14px;line-height:1.4;margin-bottom:4px;}
  .short-rail{
    position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:16px;z-index:2;
  }
  .short-rail button{
    background:none;border:none;color:#fff;font-size:12px;display:flex;flex-direction:column;

function uploadToStorage(file, onProgress){
  return new Promise((resolve, reject)=>{
    if(!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME'){
      reject(new Error('Cloudinary is not configured.'));
      return;
    }
    if(!CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_UPLOAD_PRESET === 'YOUR_UNSIGNED_UPLOAD_PRESET'){
      reject(new Error('Cloudinary is not configured.'));
      return;
    }

    const resourceType = file.type && file.type.startsWith('video/') ? 'video' : 'image';
    const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/${resourceType}/upload`;
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    form.append('folder', `${DATA_ROOT}/media`);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.upload.onprogress = e => {
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = () => {
      let res = null;
      try{ res = JSON.parse(xhr.responseText || '{}'); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && res && res.secure_url){
        resolve(res.secure_url);
      }else{
        const message = res?.error?.message || `Upload failed (${xhr.status})`;
        reject(new Error(message));
      }
    };
    xhr.onerror = () => reject(new Error('Network error reaching Cloudinary.'));
    xhr.onabort = () => reject(new Error('Upload cancelled.'));
    xhr.send(form);
  });
}

  const s = Math.floor((Date.now()-ts)/1000);
  if(s<45) return 'now';

  if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

async function markNotificationsRead(){

  notifications.forEach(n=>n.read=true);
  try{
    await Promise.all(unread.map(n=>fbPatch(`notifications/${ME.uid}/${n.id}`, { read:true })));
  }catch(err){ console.error('Could not mark notifications read:', err); }
}

// ============ ENHANCED: Download video function ============
async function downloadVideo(url, filename='video'){
  try{
    const response = await fetch(url);
    const blob = await response.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename + '.mp4';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }catch(err){
    console.error('Download failed:', err);
    alert('Failed to download video');
  }
}

      const dur = Math.floor((Date.now() - activeCall.startTime) / 1000);
      const mins = Math.floor(dur / 60);
      const secs = dur % 60;
      const el = document.getElementById('callDuration');
      if(el) el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }else{
      clearInterval(callDurationInterval);
      callDurationInterval = null;
    }
  }, 1000);
}

// ============ LOAD FROM FIREBASE ============
async function loadFromFirebase(quiet){
  if(!quiet) syncStatus='connecting';
  
  const [postsRes, shortsRes] = await Promise.allSettled([
    fbGet('posts'), fbGet('shorts')
  ]);

  if(postsRes.status==='fulfilled'){
    posts = postsObjToArray(postsRes.value);
  }else{
    console.error('Posts sync failed:', postsRes.reason);
    if(posts.length===0) posts = [];
  }

  if(shortsRes.status==='fulfilled'){
    shorts = Object.entries(shortsRes.value||{}).map(([id,s])=>({
      id, author:s.author, handle:s.handle, authorId:s.authorId||null, photoUrl:s.photoUrl||null, createdAt:s.createdAt||Date.now(),
      caption:s.caption||'', src:s.src, downloadable: !!s.downloadable,
      likes: Object.keys(s.likedBy||{}).length,
      liked: !!(ME && s.likedBy && s.likedBy[ME.uid]),
      comments: Object.entries(s.comments||{}).map(([cid,c])=>({id:cid,name:c.name,text:c.text,createdAt:c.createdAt||0}))
        .sort((a,b)=>a.createdAt-b.createdAt),
      reports:s.reports||0
    })).sort((a,b)=>b.createdAt-a.createdAt);
  }else{
    console.error('Shorts sync failed:', shortsRes.reason);
    if(shorts.length===0) shorts = [];
  }

  await refreshMyCounts();
  await loadUsersDirectory();
  await loadNotifications();
  await loadThreads();

  const anyFailed = [postsRes, shortsRes].some(r=>r.status==='rejected');
  syncStatus = anyFailed ? 'offline' : 'online';
}

async function refreshMyCounts(){
  try{
    const saved = await fbGet(`users/${ME.uid}`);
    if(saved){
      ME.followers = saved.followers || 0;
      ME.following = saved.following || 0;
    }
  }catch(err){ console.error('Could not refresh counts:', err); }
}

async function loadUsersDirectory(){
  try{
    const raw = await fbGet('users') || {};
    
    followerCounts = {};
    Object.entries(raw).forEach(([uid,u])=>{
      const followingIds = (u && u.followingIds) || {};
      Object.keys(followingIds).forEach(targetUid=>{
        if(targetUid && followingIds[targetUid] === true){
          followerCounts[targetUid] = (followerCounts[targetUid]||0) + 1;
        }
      });
    });

    allUsers = Object.entries(raw)
      .filter(([uid])=>uid!==ME.uid)
      .map(([uid,u])=>({
        uid,
        name:u?.name || 'Someone',
        handle:u?.handle || ('@'+uid.slice(0,8)),
        photoUrl:u?.photoUrl || null,
        following: !!(ME.followingIds && ME.followingIds[uid]),
        followers: followerCounts[uid] || 0,
      }));

    suggestions = allUsers.slice(0,5);
    ME.followers = followerCounts[ME.uid] || 0;
  }catch(err){
    console.error('Could not load users directory:', err);
  }
}

async function toggleFollow(uid){
  const newState = !ME.followingIds[uid];
  ME.followingIds[uid] = newState;
  
  try{
    await fbPatch(`users/${ME.uid}/followingIds`, { [uid]:newState||null });
    if(newState) sendNotification(uid, { type:'follow', text:`${ME.name} started following you` });
    await refreshMyCounts();
    await loadUsersDirectory();
    syncStatus='online';
  }catch(err){
    console.error('Could not update follow status:', err);
    ME.followingIds[uid] = !newState;
    syncStatus='offline';
  }
}

async function ensureUserProfile(user){
  let saved = null;
  try{ saved = await fbGet(`users/${user.uid}`); }
  catch(err){ console.error('Could not load profile:', err); }
  if(!saved){
    saved = blankProfile(user);
    justSignedUp = true;
    for(let attempt=0; attempt<2; attempt++){
      try{
        await fbPut(`users/${user.uid}`, saved);
        break;
      }catch(err){
        console.error(`Could not create profile (attempt ${attempt+1}):`, err);
        if(attempt===0) await new Promise(r=>setTimeout(r, 800));
      }
    }
  }
  if(saved.banned) return false;
  
  ME = {
    uid: user.uid,
    name: saved.name || user.displayName || 'New user',
    handle: saved.handle || ('@'+user.uid.slice(0,8)),
    bio: saved.bio || '',
    followers: saved.followers || 0,
    following: saved.following || 0,
    photoUrl: saved.photoUrl || user.photoURL || null,
    followingIds: saved.followingIds || {},
    strikes: saved.strikes || 0,
  };
  return true;
}

async function setShortLiked(id, liked){
  const s = shorts.find(sh=>sh.id===id);
  if(!s || !!s.liked===!!liked) return;
  s.liked = liked;
  s.likes += liked ? 1 : -1;
  const btn = document.querySelector(`[data-short-like="${id}"]`);
  if(btn){
    btn.classList.toggle('liked', !!liked);
    btn.querySelector('span').textContent = s.likes;
  }
  try{
    if(liked) await fbPatch(`shorts/${id}/likedBy`, { [ME.uid]: true });
    else await fbDelete(`shorts/${id}/likedBy/${ME.uid}`);
    syncStatus='online';
    if(liked && s.authorId) sendNotification(s.authorId, { type:'like_short', text:`${ME.name} liked your Short`, targetId:id });
  }catch(err){ console.error('Could not sync short like:', err); syncStatus='offline'; }
}

async function submitShortComment(shortId){
  const input = document.getElementById('shortCommentInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const s = shorts.find(sh=>sh.id===shortId);
  if(!s) return;
  input.value = '';
  const comment = { name:ME.name, text, createdAt:Date.now() };
  try{
    const res = await fbPost('shorts/'+shortId+'/comments', comment);
    s.comments.push({ ...comment, id:res.name });
    syncStatus='online';
    if(s.authorId) sendNotification(s.authorId, { type:'comment_short', text:`${ME.name} commented: "${text.slice(0,60)}"`, targetId:shortId });
  }catch(err){
    console.error(err);
    s.comments.push({ ...comment, id:'local-'+Date.now() });
    syncStatus='offline';
  }
  refreshShortCommentsUI(shortId);
}

async function reportShort(s){
  const newCount = (s.reports||0) + 1;
  s.reports = newCount;
  try{ await fbPatch('shorts/'+s.id, { reports:newCount }); }catch(err){ console.error(err); }

  if(newCount >= REPORT_THRESHOLD){
    shorts = shorts.filter(sh=>sh.id!==s.id);
    if(s.authorId){
      try{
        const targetProfile = await fbGet(`users/${s.authorId}`) || {};
        const strikes = (targetProfile.strikes||0) + 1;
        const banned = strikes >= STRIKE_BAN_THRESHOLD;
        await fbPatch(`users/${s.authorId}`, { strikes, banned });
      }catch(err){ console.error('Could not update uploader strikes:', err); }
    }
    alert('Thanks — this video was removed.');
  }else{
    alert('Thanks for the report.');
  }
  render();
}

function conversationIdFor(uidA, uidB){ return [uidA, uidB].sort().join('_'); }

async function loadThreads(){
  try{
    const raw = await fbGet('messages') || {};
    threads = Object.entries(raw)
      .filter(([id])=>id.includes(ME.uid))
      .map(([id, msgs])=>{
        const otherUid = id.replace(ME.uid+'_','').replace('_'+ME.uid,'');
        const otherUser = allUsers.find(u=>u.uid===otherUid);
        const msgList = Object.entries(msgs||{}).map(([mid,m])=>({id:mid,...m})).sort((a,b)=>b.createdAt-a.createdAt);
        const latest = msgList[0];
        return {
          uid: otherUid,
          name: otherUser?.name || 'User',
          photoUrl: otherUser?.photoUrl || null,
          handle: otherUser?.handle || '',
          lastText: latest?.text || '',
          lastTs: latest?.createdAt || 0
        };
      });
  }catch(err){ console.error('Could not load threads:', err); }
}

async function loadConversation(otherUid){
  try{
    const convoId = conversationIdFor(ME.uid, otherUid);
    const raw = await fbGet('messages/'+convoId) || {};
    conversationMessages = Object.entries(raw)
      .map(([id,m])=>({id,...m}))
      .sort((a,b)=>a.createdAt-b.createdAt);

}

  if(profileTab==='shorts'){
    const mine = shorts.filter(s=>s.authorId===ME.uid).slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(mine.length===0){
      return tabs + `<div class="empty"><span class="brand">No Shorts yet</span>Videos you upload will show up here — with a delete option.</div>`;
    }
    return tabs + `<div class="post-grid">
        ${mine.map(s=>`
          <div class="grid-cell">
            <video src="${s.src}" muted></video>
            <span class="grid-play">${icon.play}</span>
            <button class="media-remove" data-delete-short="${s.id}" title="Delete this Short" style="left:6px;right:auto;">${icon.close}</button>
          </div>`).join('')}
      </div>`;
  }

  if(profileTab==='followers'){
    const followerList = allUsers.filter(u => !!((u.followingIds || {})[ME.uid]));
    if(followerList.length===0){
      return tabs + `<div class="empty"><span class="brand">No followers yet</span>When someone follows you, they will appear here.</div>`;
    }
    return tabs + followerList.map(u=>`
      <div style="padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;">
        ${avatarHTML(u.name,44,u.photoUrl)}
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${escapeHTML(u.name)}</div>
          <div style="font-size:13px;color:var(--ink-soft);">${escapeHTML(u.handle)}</div>
        </div>
      </div>`).join('');
  }

  if(profileTab==='following'){
    const followingList = allUsers.filter(u => !!ME.followingIds[u.uid]);
    if(followingList.length===0){
      return tabs + `<div class="empty"><span class="brand">Not following anyone yet</span>Follow people to see their posts and Shorts.</div>`;
    }
    return tabs + followingList.map(u=>`
      <div style="padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;">
        ${avatarHTML(u.name,44,u.photoUrl)}
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${escapeHTML(u.name)}</div>
          <div style="font-size:13px;color:var(--ink-soft);">${u.followers} followers</div>
        </div>
        <button class="follow-btn following" data-unfollow="${u.uid}">Following</button>
      </div>`).join('');
  }

  const myPosts = posts.filter(p=>p.authorId===ME.uid).slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(myPosts.length===0){
    return tabs + `<div class="empty"><span class="brand">No posts yet</span>Posts you share will show up on your profile.</div>`;
  }
  return tabs + feed(myPosts);
}

function exploreView(){
  const q = exploreQuery.trim().toLowerCase();
  const results = q
    ? allUsers.filter(u=>u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q))
    : allUsers;
  return `<div class="grid-simple">
    <div class="explore-card" style="padding:12px 16px;">
      <input type="text" id="profileSearchInput" placeholder="Search people by name or @handle" value="${exploreQuery.replace(/"/g,'&quot;')}"
        style="width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;background:var(--paper-raised);outline:none;font-family:inherit;">
    </div>
    ${results.length===0
      ? `<div class="explore-card"><p class="tag">${q ? `Results for "${escapeHTML(exploreQuery)}"` : 'People to follow'}</p><p>${q ? 'No one matches that search yet.' : 'No other accounts yet'}</p></div>`
      : `<div class="explore-card">
          <p class="tag">${q ? `Results for "${escapeHTML(exploreQuery)}"` : 'People to follow'}</p>
          ${results.map(s=>`
          <div class="suggest-row" style="margin-top:12px" data-open-creator="${s.uid}">
            ${avatarHTML(s.name,34,s.photoUrl)}
            <div class="who">
              <div class="n">${escapeHTML(s.name)}</div>
              <div class="h">${escapeHTML(s.handle)} · ${s.followers||0} Followers</div>
            </div>
            <button class="follow-btn ${s.following?'following':''}" data-follow-uid="${s.uid}">${s.following?'Following':'Follow'}</button>
          </div>`).join('')}
        </div>`}
  </div>`;
}

function mainCol(){
  let body = '';
  if(view==='shorts') body = shortsView() + `<button class="short-fab" id="openUploadShort" title="Upload a short">${icon.plus}</button>`;
  else if(view==='home') body = composer() + feed(posts);
  else if(view==='profile') body = profileHeader() + profileGrid();
  else if(view==='explore') body = exploreView();
  else if(view==='notifications') body = notifsView();
  else if(view==='messages') body = messagesView();
  else if(view==='conversation') body = conversationView();

  const noTopbar = view==='shorts' || view==='conversation';
  return `<main class="main">
    ${noTopbar ? '' : `<div class="topbar">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div><h1 class="brand">${view==='home'?'Home':(view==='shorts'?'Shorts':(view==='explore'?'Explore':(view==='notifications'?'Notifications':(view==='messages'?'Messages':'Vamshi'))))}</h1></div>
        <span style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">${syncLabel()}</span>
      </div>
    </div>`}
    ${body}
  </main>`;
}

  const unread = notifications.filter(n=>!n.read).length;
  return `
  <aside class="sidebar">
    <div class="logo brand">Va<em>m</em>shi</div>
    <ul class="navlist">
      <li><button data-nav="home" class="${view==='home'?'active':''}">${icon.home}<span class="lbl">Home</span></button></li>
      <li><button data-nav="shorts" class="${view==='shorts'?'active':''}">${icon.play}<span class="lbl">Shorts</span></button></li>
      <li><button data-nav="explore" class="${view==='explore'?'active':''}">${icon.explore}<span class="lbl">Explore</span></button></li>
      <li><button data-nav="notifications" class="${view==='notifications'?'active':''}">${icon.bell}${unread>0?'<span class="nav-badge"></span>':''}<span class="lbl">Notifications</span></button></li>
      <li><button data-nav="messages" class="${view==='messages'?'active':''}">${icon.mail}<span class="lbl">Messages</span></button></li>
      <li><button data-nav="profile" class="${view==='profile'?'active':''}">${icon.user}<span class="lbl">Profile</span></button></li>

    <button class="compose-btn" id="focusComposer">New post</button>
    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle">${document.documentElement.classList.contains('dark')?icon.sun:icon.moon}<span class="lbl">${document.documentElement.classList.contains('dark')?'Light':'Dark'}</span></button>
    </div>
  </aside>`;
}

function mobileNav(){
  const unread = notifications.filter(n=>!n.read).length;
  return `
    <button data-nav="home" class="${view==='home'?'active':''}" aria-label="Home">${icon.home}</button>
    <button data-nav="shorts" class="${view==='shorts'?'active':''}" aria-label="Shorts">${icon.play}</button>
    <button data-nav="explore" class="${view==='explore'?'active':''}" aria-label="Explore">${icon.explore}</button>
    <button data-nav="notifications" class="${view==='notifications'?'active':''}" aria-label="Notifications">${icon.bell}${unread>0?'<span class="nav-badge"></span>':''}</button>
    <button data-nav="messages" class="${view==='messages'?'active':''}" aria-label="Messages">${icon.mail}</button>
    <button data-nav="profile" class="${view==='profile'?'active':''}" aria-label="Profile">${icon.user}</button>
  `;
}

function rightPanel(){
  if(view==='shorts' || view==='conversation') return '';
  return `<aside class="panel">
    <div class="card profile-card">
      ${avatarHTML(ME.name,52,ME.photoUrl)}
      <h3>${ME.name}</h3>
      <p>${ME.handle}</p>
      <div class="stat-row">
        <div><b>${ME.followers}</b> Followers</div>
        <div><b>${ME.following}</b> Following</div>
      </div>
    </div>
    ${suggestions.length>0 ? `<div class="card">
      <h4>Suggested for you</h4>
      ${suggestions.map(s=>`
        <div class="suggest-row" data-open-creator="${s.uid}">
          ${avatarHTML(s.name,34,s.photoUrl)}
          <div class="who">
            <div class="n">${escapeHTML(s.name)}</div>
            <div class="h">${escapeHTML(s.handle)}</div>
          </div>
          <button class="follow-btn ${s.following?'following':''}" data-follow-uid="${s.uid}">${s.following?'Following':'Follow'}</button>
        </div>
      `).join('')}

  </aside>`;
}

function render(){
  document.getElementById('app').innerHTML = sidebar() + mainCol() + rightPanel();
  document.getElementById('mobileNav').innerHTML = mobileNav();
  document.getElementById('modalRoot').innerHTML = activeCall ? callModal() : (showEditModal ? editModal() : (showUploadShortModal ? uploadShortModal() : ''));
  if(activeCall && activeCall.status === 'active'){
    setTimeout(startCallTimer, 100);
  }
  bind();
}

// Edit modal (simplified for space)
function editModal(){
  return `<div class="modal-back" id="modalBack"><div class="modal">
    <h3>Edit profile</h3>
    <label>Name</label>
    <input type="text" id="editName" value="${escapeHTML(ME.name)}">
    <label>Bio</label>
    <textarea id="editBio" rows="3">${escapeHTML(ME.bio)}</textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelEdit">Cancel</button>
      <button class="btn-solid" id="saveEdit">Save</button>
    </div>
  </div></div>`;
}

function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=async ()=>{
    view=b.dataset.nav; showEditModal=false; showUploadShortModal=false; render(); window.scrollTo(0,0);
    if(view==='profile' || view==='explore'){
      await refreshMyCounts();
      await loadUsersDirectory();
      render();
    }
    if(view==='notifications'){
      await loadNotifications();
      render();
      markNotificationsRead();
    }
    if(view==='messages'){
      await loadThreads();
      render();
    }
  });

  const focusBtn = document.getElementById('focusComposer');
  if(focusBtn) focusBtn.onclick = ()=>{ view='home'; render(); setTimeout(()=>document.getElementById('postText')?.focus(),0); };

  const themeBtn = document.getElementById('themeToggle');
  if(themeBtn) themeBtn.onclick = ()=>{ document.documentElement.classList.toggle('dark'); render(); };

  // Composer
  const textarea = document.getElementById('postText');
  const submitBtn = document.getElementById('submitPost');
  if(textarea){
    textarea.value = composerDraftText;
    const updateSubmitState = ()=>{
      const len = textarea.value.length;
      document.getElementById('charCount').textContent = `${len} / 280`;
      submitBtn.disabled = (len===0 && !pendingMedia) || len>280;
    };
    updateSubmitState();
    textarea.oninput = ()=>{ composerDraftText = textarea.value; updateSubmitState(); };

    const mediaBtn = document.getElementById('mediaBtn');
    const mediaInput = document.getElementById('mediaInput');
    if(mediaBtn) mediaBtn.onclick = ()=> mediaInput.click();
    if(mediaInput) mediaInput.onchange = ()=>{
      const file = mediaInput.files[0];
      if(!file) return;
      if(file.size > MAX_MEDIA_MB*1024*1024){
        alert(`File is too large (max ${MAX_MEDIA_MB}MB)`);
        return;
      }
      const type = file.type.startsWith('video') ? 'video' : 'image';
      pendingMedia = { file, previewUrl:URL.createObjectURL(file), type };
      render();
    };
    const removeMedia = document.getElementById('removeMedia');
    if(removeMedia) removeMedia.onclick = ()=>{ pendingMedia=null; render(); };

    submitBtn.onclick = async ()=>{
      const text = textarea.value.trim();
      if(!text && !pendingMedia) return;
      submitBtn.disabled = true;
      let mediaUrl = null, mediaType = null;
      if(pendingMedia){
        mediaType = pendingMedia.type;
        try{
          uploadPct = 0; render();
          mediaUrl = await uploadToStorage(pendingMedia.file, pct=>{ uploadPct = pct; document.querySelector('.upload-progress-bar') && (document.querySelector('.upload-progress-bar').style.width = pct+'%'); });
        }catch(err){
          console.error(err);
          uploadPct = null;
          alert('Upload failed: '+err.message);
          render();
          return;
        }
        uploadPct = null;
      }
      const newPost = { author:ME.name, handle:ME.handle, authorId:ME.uid, photoUrl:ME.photoUrl||null, createdAt:Date.now(), text, mediaUrl, mediaType, downloadable:false, likes:0 };
      try{
        const res = await fbPost('posts', newPost);
        posts.push({ ...newPost, id:res.name, liked:false, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error(err);
        posts.push({ ...newPost, id:'local-'+Date.now(), liked:false, comments:[] });
        syncStatus='offline';
      }
      composerDraftText = '';
      pendingMedia = null;
      render();
    };
  }

  // Like posts
  document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async ()=>{
    const p = posts.find(p=>p.id==b.dataset.like);
    const newLiked = !p.liked;
    p.liked = newLiked;
    p.likes += newLiked ? 1 : -1;
    render();
    try{
      if(newLiked) await fbPatch(`posts/${p.id}/likedBy`, { [ME.uid]: true });
      else await fbDelete(`posts/${p.id}/likedBy/${ME.uid}`);
      syncStatus='online';
      if(newLiked && p.authorId) sendNotification(p.authorId, { type:'like_post', text:`${ME.name} liked your post`, targetId:p.id });
    }catch(err){ console.error(err); syncStatus='offline'; }
  });

  // Toggle comments
  document.querySelectorAll('[data-toggle-comments]').forEach(b=>b.onclick=()=>{
    const el = document.getElementById('comments-'+b.dataset.toggleComments);
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });

  // Share
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    b.querySelector('span').textContent = 'Copied';
    setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
  });

  // Download posts
  document.querySelectorAll('[data-download]').forEach(b=>b.onclick=async ()=>{
    const p = posts.find(p=>p.id==b.dataset.download);
    if(p && p.mediaUrl) await downloadVideo(p.mediaUrl, p.author+'_post');
  });

  // Comments
  document.querySelectorAll('[data-comment-submit]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.commentSubmit;
    const input = document.querySelector(`[data-comment-input="${id}"]`);
    const text = input.value.trim();
    if(!text) return;
    const comment = { name:ME.name, text, createdAt:Date.now() };
    const post = posts.find(p=>p.id==id);
    try{
      const res = await fbPost('posts/'+id+'/comments', comment);
      post.comments.push({ ...comment, id:res.name });
      syncStatus='online';
      if(post.authorId) sendNotification(post.authorId, { type:'comment_post', text:`${ME.name} commented: "${text.slice(0,60)}"`, targetId:id });
    }catch(err){
      console.error(err);
      post.comments.push({ ...comment, id:'local-'+Date.now() });
      syncStatus='offline';
    }
    render();
    setTimeout(()=>document.getElementById('comments-'+id).style.display='flex',0);
  });

  // SHORTS
  const shortsWrap = document.getElementById('shortsWrap');
  if(shortsWrap){
    const videos = shortsWrap.querySelectorAll('video[data-video]');
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const vid = e.target;
        vid._wasIntersecting = e.isIntersecting;
        if(e.isIntersecting){ vid.play().catch(()=>{}); }
        else{ vid.pause(); }
      });
    }, { root:shortsWrap, threshold:0.6 });
    videos.forEach(v=>io.observe(v));

    shortsWrap.querySelectorAll('[data-mute]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const v = b.closest('.short').querySelector('video');
      if(v){
        v.muted = !v.muted;
        b.innerHTML = v.muted ? icon.mute : icon.unmute;
      }
    });
    shortsWrap.querySelectorAll('[data-short-like]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortLike);
      if(s) setShortLiked(s.id, !s.liked);
    });
    shortsWrap.querySelectorAll('[data-short-comment]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      openShortComments(b.dataset.shortComment);
    });
    shortsWrap.querySelectorAll('[data-short-share]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      b.querySelector('span').textContent = 'Copied';
      setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
    });
    shortsWrap.querySelectorAll('[data-short-download]').forEach(b=>b.onclick=async (e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortDownload);
      if(s) await downloadVideo(s.src, s.author+'_short');
    });
    shortsWrap.querySelectorAll('[data-short-report]').forEach(b=>b.onclick=async (e)=>{
      e.stopPropagation();
      const s = shorts.find(sh=>sh.id===b.dataset.shortReport);
      if(!s) return;
      if(!confirm('Report this video?')) return;
      await reportShort(s);
    });
    shortsWrap.querySelectorAll('[data-delete-short]').forEach(b=>b.onclick=async (e)=>{
      e.stopPropagation();
      await deleteMyShort(b.dataset.deleteShort);
    });
    shortsWrap.querySelectorAll('[data-follow-uid]').forEach(b=>b.onclick=async (e)=>{
      e.stopPropagation();
      await toggleFollow(b.dataset.followUid);
      render();
    });
  }

  // Open upload short
  const openUploadShort = document.getElementById('openUploadShort');
  if(openUploadShort) openUploadShort.onclick = ()=>{ showUploadShortModal=true; showEditModal=false; render(); };

  // Upload short file
  const shortFileInput = document.getElementById('shortFileInput');
  const pickShortFile = document.getElementById('pickShortFile');
  if(pickShortFile) pickShortFile.onclick = ()=> shortFileInput.click();
  if(shortFileInput) shortFileInput.onchange = async ()=>{
    const file = shortFileInput.files[0];
    if(!file) return;
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`File too large (max ${MAX_MEDIA_MB}MB)`);
      return;
    }
    try{
      const url = URL.createObjectURL(file);
      pendingShortFile = { file, previewUrl:url };
      render();
    }catch(err){ console.error(err); }
  };
  const removeShortFile = document.getElementById('removeShortFile');
  if(removeShortFile) removeShortFile.onclick = ()=>{ pendingShortFile=null; render(); };
  
  const shortCaptionEl = document.getElementById('shortCaption');
  if(shortCaptionEl) shortCaptionEl.oninput = ()=>{ shortCaptionDraft = shortCaptionEl.value; };

  const shortDownloadableToggle = document.getElementById('shortDownloadableToggle');
  if(shortDownloadableToggle) shortDownloadableToggle.onchange = ()=>{ shortDownloadableToggle = shortDownloadableToggle.checked; };

  const cancelUploadShort = document.getElementById('cancelUploadShort');
  const shortModalBack = document.getElementById('shortModalBack');
  if(cancelUploadShort) cancelUploadShort.onclick = ()=>{ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; render(); };
  if(shortModalBack) shortModalBack.onclick = (e)=>{ if(e.target.id==='shortModalBack'){ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; render(); } };

  const saveUploadShort = document.getElementById('saveUploadShort');
  if(saveUploadShort) saveUploadShort.onclick = async ()=>{
    if(!pendingShortFile) return;
    const caption = (shortCaptionEl?.value || '').trim();
    try{
      shortUploadPct = 0; render();
      const src = await uploadToStorage(pendingShortFile.file, pct=>{
        shortUploadPct = pct;
        const bar = document.querySelector('#shortModalBack .upload-progress-bar');
        if(bar) bar.style.width = pct+'%';
      });
      const newShort = { author:ME.name, handle:ME.handle, authorId:ME.uid, photoUrl:ME.photoUrl||null, caption, src, downloadable:shortDownloadableToggle, likes:0, createdAt:Date.now() };
      try{
        const res = await fbPost('shorts', newShort);
        shorts.unshift({ ...newShort, id:res.name, comments:[], liked:false });
        syncStatus='online';
      }catch(err){
        console.error(err);
        shorts.unshift({ ...newShort, id:'local-short-'+Date.now(), comments:[], liked:false });
        syncStatus='offline';
      }
      showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; shortUploadPct=null; shortDownloadableToggle=false;
      render();
    }catch(err){
      console.error(err);
      shortUploadPct=null;
      alert('Upload failed: '+err.message);
      render();
    }
  };

  // Edit profile
  const openEdit = document.getElementById('openEdit');
  if(openEdit) openEdit.onclick = ()=>{ showEditModal=true; showUploadShortModal=false; render(); };
  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.onclick = ()=>{ showEditModal=false; render(); };
  const modalBack = document.getElementById('modalBack');
  if(modalBack) modalBack.onclick = (e)=>{ if(e.target.id==='modalBack'){ showEditModal=false; render(); } };
  const saveEdit = document.getElementById('saveEdit');
  if(saveEdit) saveEdit.onclick = async ()=>{
    ME.name = document.getElementById('editName').value.trim() || ME.name;
    ME.bio = document.getElementById('editBio').value.trim();
    showEditModal = false;
    render();
    try{ await fbPatch(`users/${ME.uid}`, { name: ME.name, bio: ME.bio }); syncStatus='online'; }
    catch(err){ console.error(err); syncStatus='offline'; }
    render();
  };

  // Sign out
  const signOutBtn = document.getElementById('signOutBtnProfile');
  if(signOutBtn) signOutBtn.onclick = async ()=>{ try{ await auth.signOut(); }catch(err){ console.error('Sign-out failed:', err); } };

  // Profile tabs
  document.querySelectorAll('[data-profile-tab]').forEach(b=>b.onclick=()=>{
    profileTab=b.dataset.profileTab;
    render();
  });

  // Follow buttons
  document.querySelectorAll('[data-follow-uid]').forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation();
    await toggleFollow(b.dataset.followUid);
    render();
  });
  document.querySelectorAll('[data-unfollow]').forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation();
    await toggleFollow(b.dataset.unfollow);
    render();
  });

  // Open creator profile
  document.querySelectorAll('[data-open-creator]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const uid = el.dataset.openCreator;
    viewingCreator = allUsers.find(u=>u.uid===uid);
    if(viewingCreator) view = 'creatorProfile';
    render();
  });

  // Search
  const profileSearchInput = document.getElementById('profileSearchInput');
  if(profileSearchInput){
    profileSearchInput.focus();
    const pos = profileSearchInput.value.length;
    profileSearchInput.setSelectionRange(pos,pos);
    profileSearchInput.oninput = ()=>{ exploreQuery = profileSearchInput.value; render(); };
  }

  // Conversation
  document.querySelectorAll('[data-open-thread]').forEach(el=>el.onclick=()=>openConversation(el.dataset.openThread));
  const convoBack = document.querySelector('[data-convo-back]');
  if(convoBack) convoBack.onclick = async ()=>{ activeConversationUid = null; view = 'messages'; await loadThreads(); render(); };
  
  const convoInput = document.getElementById('convoInput');
  const convoSend = document.getElementById('convoSend');
  if(convoInput && convoSend){
    scrollConvoToBottom();
    const doSend = ()=>{
      const text = convoInput.value;
      if(!text.trim()) return;
      convoInput.value = '';
      sendMessage(activeConversationUid, text);
    };
    convoSend.onclick = doSend;
    convoInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSend(); } };
    convoInput.focus();
  }

  // Call buttons
  document.querySelectorAll('[data-voice-call]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const uid = b.dataset.voiceCall;
    const user = allUsers.find(u=>u.uid===uid);
    if(user) initiateCall(uid, user.name, 'voice');
  });
  document.querySelectorAll('[data-video-call]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const uid = b.dataset.videoCall;
    const user = allUsers.find(u=>u.uid===uid);
    if(user) initiateCall(uid, user.name, 'video');
  });
}

let syncTimer = null;
function startBackgroundSync(){
  if(syncTimer) return;
  syncTimer = setInterval(async ()=>{
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT');
    if(isTyping || showEditModal || showUploadShortModal || view==='shorts') return;
    await loadFromFirebase(true);
    if(view==='conversation' && activeConversationUid) await loadConversation(activeConversationUid);
    render();
  }, 7000);
}

function stopBackgroundSync(){
  if(syncTimer){ clearInterval(syncTimer); syncTimer = null; }
}

function firebaseLoadErrorScreen(){
  return `<div class="signin-screen">
    <div class="signin-card">
      <h1 class="brand" style="font-size:22px;margin-bottom:10px;">Couldn't load sign-in</h1>
      <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.5;">
        The Google sign-in script didn't load. Try disabling ad blockers, then reload.
      </p>
    </div>
  </div>`;
}

function signInScreen(errorMsg){
  return `<div class="signin-screen">
    <div class="signin-card">
      <h1 class="brand" style="font-size:26px;margin-bottom:8px;">Vamshi</h1>
      <p style="color:var(--ink-soft);margin-bottom:24px;">Short videos, real connections</p>
      <div id="googleSignIn" style="width:100%;"></div>
      ${errorMsg ? `<div class="error">${escapeHTML(errorMsg)}</div>` : ''}
    </div>
  </div>`;
}

if(firebaseInitError || !auth){
  document.getElementById('app').innerHTML = firebaseLoadErrorScreen();
}else{
  auth.onAuthStateChanged(async (user)=>{
    stopBackgroundSync();
    if(!user){
      ME = null;
      document.getElementById('app').innerHTML = signInScreen();
      document.getElementById('mobileNav').innerHTML = '';
      document.getElementById('modalRoot').innerHTML = '';
      if(window.google){
        google.accounts.id.initialize({
          client_id: '853425928215-...usercontent.com',
          callback: async (response)=>{
            try{
              const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
              await auth.signInWithCredential(credential);
            }catch(err){
              console.error('Sign-in failed:', err);
              document.getElementById('app').innerHTML = signInScreen(err.message);
            }
          }
        });
        google.accounts.id.renderButton(document.getElementById('googleSignIn'), { theme:'outline', size:'large' });
      }
      return;
    }
    document.getElementById('app').innerHTML = '<div class="signin-screen"><div class="signin-card"><p>Loading...</p></div></div>';
    const ok = await ensureUserProfile(user);
    if(!ok){
      document.getElementById('app').innerHTML = '<div class="signin-screen"><div class="signin-card"><h1>Account suspended</h1></div></div>';
      try{ await auth.signOut(); }catch(err){ console.error(err); }
      return;
    }
    await loadFromFirebase();
    if(justSignedUp){ view='explore'; justSignedUp=false; }
    render();
    startBackgroundSync();
  });
}
</script>
