<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vamshi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#FAF7F1;
    --paper-raised:#FFFFFF;
    --ink:#231A33;
    --ink-soft:#6E6579;
    --line:#E6E0D2;
    --gold:#AD8422;
    --gold-soft:#F1E6C8;
    --berry:#A23F55;
    --berry-soft:#F3DEE2;
    --sidebar-w:240px;
    --panel-w:320px;
    --radius:3px;
  }
  html.dark{
    --paper:#1C1626;
    --paper-raised:#241D31;
    --ink:#F3EEE3;
    --ink-soft:#B1A7BE;
    --line:#3A314B;
    --gold:#D9B04C;
    --gold-soft:#3A3122;
    --berry:#D97C90;
    --berry-soft:#3A222A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  body,input,textarea,button{
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  body{
    background:var(--paper);
    transition:background .25s ease, color .25s ease;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  a{color:inherit;text-decoration:none;}
  button{cursor:pointer;font:inherit;}
  ::selection{background:var(--gold-soft);}
  svg{width:20px;height:20px;flex:none;}

  /* ---------- APP SHELL ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--panel-w);
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    border-right:1px solid var(--line);
    padding:28px 18px;
    position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column;
  }
  .logo{
    font-size:26px;
    letter-spacing:.2px;
    margin:0 8px 34px;
  }
  .logo em{font-style:italic; color:var(--gold);}
  .navlist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px;}
  .navlist button{
    width:100%;
    display:flex; align-items:center; gap:14px;
    background:none; border:none;
    padding:11px 10px;
    border-radius:var(--radius);
    font-size:15.5px;
    text-align:left;
    color:var(--ink-soft);
  }
  .navlist button svg{width:21px;height:21px;flex:none;}
  .navlist button .lbl{display:inline;}
  .navlist button.active{ color:var(--ink); font-weight:600; }
  .navlist button.active svg{ stroke:var(--berry); }
  .navlist button:hover{background:var(--paper-raised);}
  .compose-btn{
    margin-top:22px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:13px 0;
    font-weight:600;
    font-size:15px;
  }
  html.dark .compose-btn{background:var(--gold); color:#1C1626;}
  .compose-btn:hover{opacity:.88;}
  .sidebar-foot{margin-top:auto; padding-top:18px;}
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line); border-radius:999px;
    padding:8px 12px; background:var(--paper-raised);
    font-size:13.5px; color:var(--ink-soft); width:100%;
    white-space:nowrap; overflow:hidden;
  }

  /* ---------- MAIN COLUMN ---------- */
  .main{border-right:1px solid var(--line); min-height:100vh; position:relative;}
  .topbar{
    position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 22px;
  }
  .topbar h1{
    font-family:'Fraunces', serif;
    font-size:20px; margin:0; font-weight:600;
  }
  .topbar p{margin:2px 0 0; font-size:13px; color:var(--ink-soft);}

  .composer{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:600; font-size:14px; flex:none; color:#fff;
    overflow:hidden; position:relative;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .composer-body{flex:1;}
  .composer textarea{
    width:100%; border:none; resize:none; background:none;
    font-size:16.5px; line-height:1.45; outline:none; min-height:52px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .composer textarea::placeholder{color:var(--ink-soft);}
  .composer-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .composer-count{font-size:12.5px; color:var(--ink-soft);}
  .composer-tools{display:flex; align-items:center; gap:10px;}
  .media-btn{
    background:none; border:1px solid var(--line); border-radius:999px;
    padding:7px 9px; color:var(--ink-soft); display:flex; align-items:center;
  }
  .media-btn:hover{color:var(--berry); border-color:var(--berry);}
  .media-preview{position:relative; margin-top:10px; max-width:320px;}
  .media-preview img, .media-preview video{width:100%; border-radius:var(--radius); border:1px solid var(--line); display:block; max-height:280px; background:#000;}
  .media-remove{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .upload-progress{margin-top:8px; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .upload-progress-bar{height:100%; background:var(--berry); transition:width .15s ease;}
  .upload-label{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .post-submit{
    background:var(--berry); color:#fff; border:none;
    border-radius:999px; padding:9px 20px; font-weight:600; font-size:14px;
  }
  .post-submit:disabled{opacity:.4; cursor:default;}

  /* ---------- FEED / POSTS ---------- */
  .feed{}
  .post{
    padding:18px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:12px; animation:fade .35s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .post-main{flex:1; min-width:0;}
  .post-head{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
  .post-head .name{font-weight:600; font-size:15px;}
  .post-head .handle, .post-head .dot, .post-head .time{color:var(--ink-soft); font-size:13.5px;}
  .post-text{margin:5px 0 10px; font-size:15.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
  .post-media{border-radius:var(--radius); margin-bottom:10px; overflow:hidden; border:1px solid var(--line); background:#000;}
  .post-media img, .post-media video{width:100%; max-height:520px; display:block; object-fit:contain; background:#000;}
  .post-actions{display:flex; gap:26px;}
  .act{
    display:flex; align-items:center; gap:7px;
    background:none; border:none; color:var(--ink-soft); font-size:13.5px;
  }
  .act svg{width:18px;height:18px;}
  .act:hover{color:var(--ink);}
  .act.liked{color:var(--berry);}
  .act.liked svg{fill:var(--berry); stroke:var(--berry);}

  .comments{margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; display:flex; flex-direction:column; gap:10px;}
  .comment{display:flex; gap:9px; font-size:14px;}
  .comment .name{font-weight:600; margin-right:6px;}
  .comment-form{display:flex; gap:9px; align-items:center; margin-top:2px;}
  .comment-form input{
    flex:1; border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-size:13.5px; background:var(--paper-raised); outline:none;
  }
  .comment-form button{background:none; border:none; color:var(--berry); font-weight:600; font-size:13.5px;}

  /* ---------- RIGHT PANEL ---------- */
  .panel{padding:26px 20px; display:flex; flex-direction:column; gap:26px;}
  .card{border:1px solid var(--line); border-radius:var(--radius); padding:18px; background:var(--paper-raised);}
  .profile-card .avatar{width:52px;height:52px;font-size:17px;margin-bottom:10px;}
  .profile-card h3{margin:0 0 2px; font-family:'Fraunces', serif; font-size:18px;}
  .profile-card p{margin:0 0 12px; font-size:13.5px; color:var(--ink-soft);}
  .stat-row{display:flex; gap:18px; font-size:13px;}
  .stat-row b{display:block; font-size:15px;}
  .card h4{margin:0 0 12px; font-size:13.5px; text-transform:none; letter-spacing:.2px; color:var(--ink-soft); font-weight:600;}
  .suggest-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .suggest-row .avatar{width:34px;height:34px;font-size:12px;}
  .suggest-row .who{flex:1; min-width:0;}
  .suggest-row .who .n{font-size:13.5px; font-weight:600;}
  .suggest-row .who .h{font-size:12px; color:var(--ink-soft);}
  .follow-btn{border:1px solid var(--ink); background:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600;}
  .follow-btn.following{background:var(--ink); color:var(--paper);}
  .trend{padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .trend:last-child{border:none;}
  .trend .tag{font-weight:600; display:block;}
  .trend .n{color:var(--ink-soft); font-size:12px;}

  /* ---------- VIEWS: PROFILE / EXPLORE / NOTIFS / MESSAGES ---------- */
  .profile-banner{height:120px; background:linear-gradient(120deg, var(--gold-soft), var(--berry-soft));}
  .profile-head{padding:0 22px 18px; margin-top:-34px;}
  .profile-head .avatar{width:84px;height:84px; font-size:26px; border:4px solid var(--paper); margin-bottom:10px;}
  .profile-head h2{font-family:'Fraunces', serif; margin:0 0 2px; font-size:23px;}
  .profile-head .handle{color:var(--ink-soft); font-size:14px;}
  .profile-head .bio{margin:12px 0; font-size:14.5px; line-height:1.5; max-width:480px;}
  .profile-stats{display:flex; gap:20px; font-size:13.5px; margin-bottom:14px;}
  .profile-stats b{color:var(--ink);}
  .edit-btn{border:1px solid var(--line); background:var(--paper-raised); border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:600;}

  .grid-simple{padding:20px 22px; display:grid; gap:14px;}
  .explore-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .explore-card .tag{font-family:'Fraunces', serif; font-size:17px; margin:0 0 4px;}
  .explore-card p{margin:0; font-size:13px; color:var(--ink-soft);}

  .notif{display:flex; gap:12px; padding:15px 22px; border-bottom:1px solid var(--line); align-items:flex-start;}
  .notif svg{width:20px;height:20px; flex:none; margin-top:2px; stroke:var(--berry);}
  .notif .t{font-size:14.5px;}
  .notif .time{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .msg-thread{display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line);}
  .msg-thread .who{flex:1; min-width:0;}
  .msg-thread .n{font-weight:600; font-size:14.5px;}
  .msg-thread .preview{font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .empty{padding:60px 22px; text-align:center; color:var(--ink-soft);}
  .empty .brand{display:block; font-size:20px; color:var(--ink); margin-bottom:6px;}

  /* ---------- STORIES BAR (Instagram-style) ---------- */
  .stories{display:flex; gap:16px; padding:16px 22px; border-bottom:1px solid var(--line); overflow-x:auto;}
  .story{display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; width:64px;}
  .story-ring{width:60px;height:60px;border-radius:50%; padding:2.5px; background:linear-gradient(135deg,var(--gold),var(--berry));}
  .story-ring.seen{background:var(--line);}
  .story-ring .avatar{width:100%;height:100%; border:2.5px solid var(--paper); font-size:15px;}
  .story .sname{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;}
  .story.you .story-ring{background:var(--line); position:relative;}
  .story-plus{position:absolute; bottom:-2px; right:-2px; width:20px;height:20px;border-radius:50%; background:var(--berry); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid var(--paper);}
  .story-plus svg{width:12px;height:12px;}

  /* ---------- PROFILE GRID (Instagram-style) ---------- */
  .profile-tabs{display:flex; border-bottom:1px solid var(--line); margin-top:6px;}
  .profile-tabs button{flex:1; padding:12px 0; background:none; border:none; color:var(--ink-soft); font-size:13px; font-weight:600; letter-spacing:.3px; border-bottom:2px solid transparent;}
  .profile-tabs button.active{color:var(--ink); border-bottom-color:var(--berry);}
  .post-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px;}
  .grid-cell{position:relative; aspect-ratio:1/1; background:var(--paper-raised); overflow:hidden;}
  .grid-cell img, .grid-cell video{width:100%;height:100%;object-fit:cover; display:block;}
  .grid-cell .grid-text{padding:8px; font-size:11.5px; line-height:1.35; color:var(--ink-soft); overflow:hidden;}
  .grid-cell .grid-play{position:absolute; top:6px; right:6px; width:16px;height:16px; filter:drop-shadow(0 0 2px rgba(0,0,0,.6));}
  .grid-cell .grid-play svg{stroke:#fff; width:16px;height:16px;}

  /* ---------- SHORTS (YouTube Shorts / Reels style) ---------- */
  .shorts-wrap{
    height:100vh;
    overflow-y:scroll; scroll-snap-type:y mandatory;
    background:#000;
  }
  @media (max-width:640px){ .shorts-wrap{height:calc(100vh - 64px);} }
  .short{
    position:relative; height:100vh; scroll-snap-align:start;
    display:flex; align-items:center; justify-content:center; background:#000;
    overflow:hidden;
  }
  @media (max-width:640px){ .short{height:calc(100vh - 64px);} }
  .short video{width:100%; height:100%; object-fit:cover; display:block;}
  .short-overlay{
    position:absolute; left:0; right:0; bottom:0;
    padding:18px 76px 22px 18px;
    background:linear-gradient(0deg, rgba(0,0,0,.65), transparent 70%);
    color:#fff;
  }
  .short-overlay .name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  .short-overlay .name .avatar{width:26px;height:26px;font-size:11px;}
  .short-overlay .cap{font-size:13.5px; margin-top:6px; line-height:1.4;}
  .short-rail{
    position:absolute; right:10px; bottom:22px; display:flex; flex-direction:column;
    align-items:center; gap:20px; color:#fff;
  }
  .short-rail button{background:none; border:none; color:#fff; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11.5px; font-weight:600;}
  .short-rail button svg{width:27px;height:27px; stroke:#fff; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
  .short-rail button.liked svg{fill:var(--berry); stroke:var(--berry);}
  .short-mute{
    position:absolute; top:16px; right:16px; width:32px;height:32px; border-radius:50%;
    background:rgba(0,0,0,.4); border:none; color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .short-mute svg{width:16px;height:16px;stroke:#fff;}
  .short-fab{
    position:absolute; right:60px; top:16px; width:36px;height:36px; border-radius:50%;
    background:var(--berry); color:#fff; border:2px solid rgba(255,255,255,.85);
    display:flex; align-items:center; justify-content:center; z-index:6;
    box-shadow:0 3px 10px rgba(0,0,0,.35);
  }
  .short-fab svg{width:17px;height:17px;stroke:#fff;}

  /* ---------- DOUBLE-TAP HEART BURST ---------- */
  .short-heart-burst{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
    pointer-events:none; opacity:0; z-index:7;
    animation:heartBurst .75s ease forwards;
  }
  .short-heart-burst svg{width:92px;height:92px; fill:#fff; stroke:#fff; filter:drop-shadow(0 2px 10px rgba(0,0,0,.45));}
  @keyframes heartBurst{
    0%{transform:translate(-50%,-50%) scale(0.3); opacity:0;}
    18%{transform:translate(-50%,-50%) scale(1.15); opacity:1;}
    32%{transform:translate(-50%,-50%) scale(0.95); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0;}
  }
  .heart-burst{
    position:absolute; pointer-events:none; width:84px; height:84px;
    opacity:0; transform:translate(-50%,-50%) scale(0.5);
    animation:heartBurst .75s ease forwards; z-index:8;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));
  }
  @keyframes heartBurst{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.4);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
    32%{transform:translate(-50%,-50%) scale(0.92);}
    42%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.05);}
  }

  /* ---------- PROFILE PHOTO EDIT ---------- */
  .photo-edit{position:relative; width:84px; display:inline-block;}
  .photo-edit-btn{
    position:absolute; bottom:8px; right:-4px; width:28px;height:28px; border-radius:50%;
    background:var(--ink); color:var(--paper); border:2px solid var(--paper);
    display:flex; align-items:center; justify-content:center;
  }
  .photo-edit-btn svg{width:14px;height:14px;}
  .modal-avatar-row{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
  .modal-avatar-row .avatar{width:56px;height:56px;font-size:18px;}
  .modal-change-photo{border:1px solid var(--line); background:var(--paper-raised); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600;}

  /* ---------- MOBILE BOTTOM NAV ---------- */
  .mobile-nav{
    display:none;
    position:fixed; bottom:0; left:0; right:0;
    background:var(--paper-raised); border-top:1px solid var(--line);
    padding:9px 6px calc(9px + env(safe-area-inset-bottom));
    z-index:20;
    justify-content:space-around;
  }
  .mobile-nav button{background:none; border:none; color:var(--ink-soft); padding:6px;}
  .mobile-nav button.active{color:var(--berry);}
  .mobile-nav svg{width:23px;height:23px;}
  .modal-back{
    position:fixed; inset:0; background:rgba(20,15,28,.45);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper-raised); border-radius:6px; padding:24px;
    width:100%; max-width:380px; border:1px solid var(--line);
  }
  .modal h3{margin:0 0 16px; font-family:'Fraunces', serif;}
  .modal label{display:block; font-size:12.5px; color:var(--ink-soft); margin:12px 0 5px;}
  .modal input, .modal textarea{
    width:100%; border:1px solid var(--line); border-radius:4px; padding:9px 11px;
    font-size:14px; background:var(--paper); font-family:inherit; outline:none;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .modal-actions button{padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:600;}
  .btn-ghost{background:none; border:1px solid var(--line);}
  .btn-solid{background:var(--ink); color:var(--paper); border:none;}

  /* AUTH GATE */
  .auth-gate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{width:100%;max-width:390px;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:26px;box-shadow:0 12px 40px rgba(35,26,51,.10);}
  .auth-brand{font-family:'Fraunces',serif;font-size:30px;font-weight:600;text-align:center;margin-bottom:6px}.auth-brand em{font-style:italic;color:var(--gold)}
  .auth-sub{text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:20px}.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
  .auth-tabs button{flex:1;border:0;background:none;padding:10px;color:var(--ink-soft);font-weight:600;border-bottom:2px solid transparent}.auth-tabs button.active{color:var(--ink);border-bottom-color:var(--berry)}
  .auth-card label{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px}.auth-card input{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px 12px;font-size:15px;background:var(--paper);outline:none}
  .auth-primary{width:100%;margin-top:18px;border:0;border-radius:999px;padding:11px 16px;background:var(--berry);color:#fff;font-weight:700}.auth-primary:disabled{opacity:.5}
  .google-btn{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:var(--paper-raised);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}.google-btn:hover{background:var(--paper)}.google-icon{width:18px;height:18px;display:block} .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0 2px;color:var(--ink-soft);font-size:11px}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}

/*
 * Media is NOT stored in Firebase Storage.
 * Cloudinary stores the image/video files and Firebase only stores the returned URL.

 * IMPORTANT: create an UNSIGNED upload preset in your Cloudinary account and put
 * your Cloud Name + preset below. Never put a Cloudinary API Secret in this file.
 */
const CLOUDINARY_CLOUD_NAME = 'uv3ua3b7';
const CLOUDINARY_UPLOAD_PRESET = 'Vamshi';

function uploadToStorage(file, onProgress){
  return new Promise((resolve, reject)=>{
    if(!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME'){
      reject(new Error('Cloudinary is not configured. Set CLOUDINARY_CLOUD_NAME in the HTML file.'));
      return;
    }
    if(!CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_UPLOAD_PRESET === 'YOUR_UNSIGNED_UPLOAD_PRESET'){
      reject(new Error('Cloudinary is not configured. Set an unsigned CLOUDINARY_UPLOAD_PRESET in the HTML file.'));
      return;
    }

    const resourceType = file.type && file.type.startsWith('video/') ? 'video' : 'image';
    const url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/${resourceType}/upload`;
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    form.append('folder', `${DATA_ROOT}/media`);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.upload.onprogress = e => {
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = () => {
      let res = null;
      try{ res = JSON.parse(xhr.responseText || '{}'); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && res && res.secure_url){
        resolve(res.secure_url);
      }else{
        const message = res?.error?.message || `Cloudinary upload failed (${xhr.status})`;
        reject(new Error(message));
      }
    };
    xhr.onerror = () => reject(new Error('Network error reaching Cloudinary. Check your internet connection and Cloudinary upload preset.'));
    xhr.onabort = () => reject(new Error('Upload cancelled.'));
    xhr.send(form);
  });
}

function timeAgo(ts){
  if(!ts) return 'now';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<45) return 'now';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

async function seedIfEmpty(){
  // Each check runs independently — a denied/broken path (e.g. a Firebase
  // rules 401 on just "shorts") shouldn't stop posts/profile from seeding.
  try{
    const existing = await fbGet('posts');
    if(!existing){ for(const p of SEED_POSTS){ await fbPost('posts', p); } }
  }catch(err){ console.error('Could not check/seed "posts" (check Firebase rules for this path):', err); }

  try{
    const profilePath = currentProfilePath();
    const existingProfile = await fbGet(profilePath);
    if(!existingProfile){
      // Keep the existing legacy profile intact; new logins get their own profile by UID.
      await fbPut(profilePath, userProfileDefaults());
    }
  }catch(err){ console.error('Could not check/seed "profile" (check Firebase rules for this path):', err); }

  try{
    const existingShorts = await fbGet('shorts');
    if(!existingShorts){ for(const s of SEED_SHORTS){ await fbPost('shorts', s); } }
  }catch(err){ console.error('Could not check/seed "shorts" (check Firebase rules for this path):', err); }
}

async function loadFromFirebase(quiet){
  if(!quiet) syncStatus='connecting';
  await authReady;
  // Firebase Auth identifies the account before we load its profile.
  // This makes the same phone-number account load the same profile on every device.
  await seedIfEmpty();

  // Fetch all three independently — allSettled means one 401/network error
  // on "shorts" no longer blanks out posts/profile that loaded just fine.
  const [postsRes, profileRes, shortsRes] = await Promise.allSettled([
    fbGet('posts'), fbGet(currentProfilePath()), fbGet('shorts')
  ]);

  if(postsRes.status==='fulfilled'){
    const fresh = postsObjToArray(postsRes.value);
    // keep this device's "liked" toggle state across a refresh
    fresh.forEach(p=>{ const old = posts.find(o=>o.id===p.id); if(old) p.liked = old.liked; });
    posts = fresh;
  }else{
    console.error('Posts sync failed:', postsRes.reason);
    if(posts.length===0) posts = SEED_POSTS.map((p,i)=>({id:'local-'+i, ...p, liked:false}));
  }

  if(profileRes.status==='fulfilled'){
    const profile = profileRes.value;
    if(profile){ ME.name=profile.name||ME.name; ME.bio=profile.bio||ME.bio; ME.followers=profile.followers||ME.followers; ME.following=profile.following||ME.following; ME.photoUrl=profile.photoUrl||ME.photoUrl; }
  }else{
    console.error('Profile sync failed:', profileRes.reason);
  }

  if(shortsRes.status==='fulfilled'){
    shorts = shortsObjToArray(shortsRes.value).sort((a,b)=>b.createdAt-a.createdAt);
  }else{
    console.error('Shorts sync failed:', shortsRes.reason);
    if(shorts.length===0) shorts = SEED_SHORTS.map((s,i)=>({id:'local-short-'+i, ...s}));
  }

  const anyFailed = [postsRes, profileRes, shortsRes].some(r=>r.status==='rejected');
  syncStatus = anyFailed ? 'offline' : 'online';
}

/* EMAIL/PASSWORD AUTH — no paid SMS */
function authMsg(t,type=''){const e=document.getElementById('authMsg');if(e){e.textContent=t||'';e.className='auth-msg'+(type?' '+type:'')}}
function renderAuth(){const g=document.getElementById('authGate');if(!g)return;g.style.display=firebaseUser?'none':'flex';document.getElementById('authLoginTab')?.classList.toggle('active',authMode==='login');document.getElementById('authSignupTab')?.classList.toggle('active',authMode==='signup');const b=document.getElementById('authSubmit');if(b)b.textContent=authMode==='login'?'Log in':'Create account';const r=document.getElementById('authReset');if(r)r.style.display=authMode==='login'?'block':'none'}
function authError(e){const m={'auth/invalid-email':'Enter a valid email address.','auth/user-not-found':'No account found with this email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Email or password is incorrect.','auth/email-already-in-use':'An account already exists with this email. Log in instead.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Please wait.','auth/network-request-failed':'Network error. Check your internet.','auth/operation-not-allowed':'Enable Email/Password in Firebase Authentication first.'};return m[e?.code]||e?.message||'Authentication failed.'}
async function signInWithGoogle(){
  const btn=document.getElementById('googleSignIn');
  if(!['http:','https:','chrome-extension:'].includes(location.protocol)){
    authMsg('Google sign-in is unavailable in this environment. Please use the app from its hosted website.','error');
    if(btn) btn.disabled=false;
    return;
  }
  if(!window.localStorage){
    authMsg('Web storage is disabled in this browser. Enable site storage/cookies and try again.','error');
    if(btn) btn.disabled=false;
    return;
  }
  if(btn) btn.disabled=true;
  authMsg('Opening Google sign-in…');
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await firebaseAuth.signInWithPopup(provider);
  }catch(err){
    console.error(err);
    if(err.code==='auth/popup-blocked'){
      try{ await firebaseAuth.signInWithRedirect(provider); return; }catch(e){ console.error(e); authMsg(authError(e),'error'); }
    }else if(err.code==='auth/account-exists-with-different-credential'){
      authMsg('This email already uses another sign-in method. Log in with that method first.','error');
    }else{ authMsg(authError(err),'error'); }
    if(btn) btn.disabled=false;
  }
}

function bindAuth(){
  document.getElementById('googleSignIn')?.addEventListener('click',signInWithGoogle);document.getElementById('authLoginTab')?.addEventListener('click',()=>{authMode='login';authMsg('');renderAuth()});document.getElementById('authSignupTab')?.addEventListener('click',()=>{authMode='signup';authMsg('');renderAuth()});document.getElementById('authForm')?.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('authEmail').value.trim(),pw=document.getElementById('authPassword').value,b=document.getElementById('authSubmit');if(!email||pw.length<6)return authMsg('Enter a valid email and a password of at least 6 characters.','error');b.disabled=true;authMsg(authMode==='login'?'Signing in…':'Creating your account…');try{if(authMode==='signup')await firebaseAuth.createUserWithEmailAndPassword(email,pw);else await firebaseAuth.signInWithEmailAndPassword(email,pw)}catch(err){console.error(err);authMsg(authError(err),'error');b.disabled=false}});document.getElementById('authReset')?.addEventListener('click',async()=>{const email=document.getElementById('authEmail').value.trim();if(!email)return authMsg('Enter your email first.','error');try{await firebaseAuth.sendPasswordResetEmail(email);authMsg('Password reset email sent. Check your inbox.','ok')}catch(err){authMsg(authError(err),'error')}})}
firebaseAuth.onAuthStateChanged(async u=>{firebaseUser=u||null;authReadyResolve(firebaseUser);renderAuth();if(firebaseUser){Object.assign(ME,userProfileDefaults());try{const x=await fbGet(currentProfilePath());if(x)Object.assign(ME,{name:x.name||ME.name,handle:x.handle||ME.handle,bio:x.bio||ME.bio,followers:x.followers??ME.followers,following:x.following??ME.following,photoUrl:x.photoUrl||ME.photoUrl});else await fbPut(currentProfilePath(),ME)}catch(err){console.error('Profile init failed',err)}render()}});
bindAuth();renderAuth();

/* ---------------- EVENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ view=b.dataset.nav; showEditModal=false; showUploadShortModal=false; render(); window.scrollTo(0,0); });

  const focusBtn = document.getElementById('focusComposer');
  if(focusBtn) focusBtn.onclick = ()=>{ view='home'; render(); setTimeout(()=>document.getElementById('postText')?.focus(),0); };

  const themeBtn = document.getElementById('themeToggle');
  if(themeBtn) themeBtn.onclick = ()=>{ document.documentElement.classList.toggle('dark'); render(); };

  const textarea = document.getElementById('postText');
  const submitBtn = document.getElementById('submitPost');
  if(textarea){
    textarea.value = composerDraftText; // preserve text across re-renders (e.g. after picking media)
    const updateSubmitState = ()=>{
      const len = textarea.value.length;
      document.getElementById('charCount').textContent = `${len} / 280`;
      submitBtn.disabled = (len===0 && !pendingMedia) || len>280;
    };
    updateSubmitState();
    textarea.oninput = ()=>{ composerDraftText = textarea.value; updateSubmitState(); };

    const mediaBtn = document.getElementById('mediaBtn');
    const mediaInput = document.getElementById('mediaInput');
    if(mediaBtn) mediaBtn.onclick = ()=> mediaInput.click();
    if(mediaInput) mediaInput.onchange = ()=>{
      const file = mediaInput.files[0];
      if(!file) return;
      if(file.size > MAX_MEDIA_MB*1024*1024){
        alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
        return;
      }
      const type = file.type.startsWith('video') ? 'video' : 'image';
      pendingMedia = { file, previewUrl:URL.createObjectURL(file), type };
      render();
    };
    const removeMedia = document.getElementById('removeMedia');
    if(removeMedia) removeMedia.onclick = ()=>{ pendingMedia=null; render(); };

    submitBtn.onclick = async ()=>{
      const text = textarea.value.trim();
      if(!text && !pendingMedia) return;
      submitBtn.disabled = true;
      let mediaUrl = null, mediaType = null;
      if(pendingMedia){
        mediaType = pendingMedia.type;
        try{
          uploadPct = 0; render();
          mediaUrl = await uploadToStorage(pendingMedia.file, pct=>{ uploadPct = pct; document.querySelector('.upload-progress-bar') && (document.querySelector('.upload-progress-bar').style.width = pct+'%', document.querySelector('.upload-label').textContent = 'Uploading… '+pct+'%'); });
        }catch(err){
          console.error(err);
          uploadPct = null;
          alert('Upload failed: '+err.message);
          render();
          return;
        }
        uploadPct = null;
      }
      const newPost = { author:ME.name, handle:ME.handle, createdAt:Date.now(), text, mediaUrl, mediaType, likes:0 };
      try{
        const res = await fbPost('posts', newPost);
        posts.push({ ...newPost, id:res.name, liked:false, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error(err);
        posts.push({ ...newPost, id:'local-'+Date.now(), liked:false, comments:[] });
        syncStatus='offline';
      }
      composerDraftText = '';
      pendingMedia = null;
      render();
    };
  }

  document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async ()=>{
    const p = posts.find(p=>p.id==b.dataset.like);
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    render();
    try{ await fbPatch('posts/'+p.id, { likes:p.likes }); syncStatus='online'; }
    catch(err){ console.error(err); syncStatus='offline'; }
  });

  document.querySelectorAll('[data-toggle-comments]').forEach(b=>b.onclick=()=>{
    const el = document.getElementById('comments-'+b.dataset.toggleComments);
    el.style.display = el.style.display==='none' ? 'flex' : 'none';
  });

  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    b.querySelector('span').textContent = 'Copied';
    setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
  });

  document.querySelectorAll('[data-comment-submit]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.commentSubmit;
    const input = document.querySelector(`[data-comment-input="${id}"]`);
    const text = input.value.trim();
    if(!text) return;
    const comment = { name:ME.name, text, createdAt:Date.now() };
    const post = posts.find(p=>p.id==id);
    try{
      const res = await fbPost('posts/'+id+'/comments', comment);
      post.comments.push({ ...comment, id:res.name });
      syncStatus='online';
    }catch(err){
      console.error(err);
      post.comments.push({ ...comment, id:'local-'+Date.now() });
      syncStatus='offline';
    }
    render();
    setTimeout(()=>document.getElementById('comments-'+id).style.display='flex',0);
  });

  /* Shorts: autoplay whichever short is in view, pause the rest */
  const shortsWrap = document.getElementById('shortsWrap');
  if(shortsWrap){
    const videos = shortsWrap.querySelectorAll('video[data-video]');
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        const vid = e.target;
        if(e.isIntersecting){ vid.play().catch(()=>{}); }
        else{ vid.pause(); }
      });
    }, { root:shortsWrap, threshold:0.6 });
    videos.forEach(v=>io.observe(v));

    shortsWrap.querySelectorAll('[data-mute]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const vid = shortsWrap.querySelector(`video[data-video="${b.dataset.mute}"]`);
      vid.muted = !vid.muted;
      b.innerHTML = vid.muted ? icon.mute : icon.unmute;
    });
    shortsWrap.querySelectorAll('[data-short-like]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      setShortLiked(b.dataset.shortLike, !shortsLiked[b.dataset.shortLike]);
    });
    shortsWrap.querySelectorAll('[data-short-share]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      b.querySelector('span').textContent = 'Copied';
      setTimeout(()=>{ b.querySelector('span').textContent='Share'; },1200);
    });
    shortsWrap.querySelectorAll('[data-short-comment]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      alert('Comments coming soon for Shorts.');
    });

    // Double-tap (or double-click) anywhere on the video to like it, TikTok/Reels-style
    shortsWrap.querySelectorAll('.short').forEach(shortEl=>{
      let lastTap = 0;
      shortEl.addEventListener('click', (e)=>{
        if(e.target.closest('button')) return; // rail/mute buttons handle themselves
        const now = Date.now();
        if(now - lastTap < 320){
          const id = shortEl.dataset.short;
          if(!shortsLiked[id]) setShortLiked(id, true);
          spawnHeartBurst(shortEl);
          lastTap = 0;
        } else {
          lastTap = now;
        }
      });
    });
  }

  const openUploadShort = document.getElementById('openUploadShort');
  if(openUploadShort) openUploadShort.onclick = ()=>{ showUploadShortModal=true; showEditModal=false; render(); };

  const shortFileInput = document.getElementById('shortFileInput');
  const pickShortFile = document.getElementById('pickShortFile');
  if(pickShortFile) pickShortFile.onclick = ()=> shortFileInput.click();
  if(shortFileInput) shortFileInput.onchange = ()=>{
    const file = shortFileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('video')){ alert('Please choose a video file.'); return; }
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
      shortFileInput.value = '';
      return;
    }
    const url = URL.createObjectURL(file);
    // Probe the video's duration before accepting it — Shorts are capped at 3 minutes.
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = ()=>{
      if(probe.duration && probe.duration > MAX_SHORT_SECONDS){
        alert(`Shorts must be ${Math.round(MAX_SHORT_SECONDS/60)} minutes or under. That video is about ${Math.ceil(probe.duration/60)} min long — trim it and try again.`);
        URL.revokeObjectURL(url);
        shortFileInput.value = '';
        return;
      }
      pendingShortFile = { file, previewUrl:url };
      render();
    };
    probe.onerror = ()=>{
      // Couldn't read duration (unusual format) — let it through, the upload step will surface any real problem.
      pendingShortFile = { file, previewUrl:url };
      render();
    };
    probe.src = url;
  };
  const shortCaptionEl = document.getElementById('shortCaption');
  if(shortCaptionEl) shortCaptionEl.oninput = ()=>{ shortCaptionDraft = shortCaptionEl.value; };
  const removeShortFile = document.getElementById('removeShortFile');
  if(removeShortFile) removeShortFile.onclick = ()=>{ pendingShortFile=null; render(); };
  const cancelUploadShort = document.getElementById('cancelUploadShort');
  if(cancelUploadShort) cancelUploadShort.onclick = ()=>{ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; render(); };
  const shortModalBack = document.getElementById('shortModalBack');
  if(shortModalBack) shortModalBack.onclick = (e)=>{ if(e.target.id==='shortModalBack'){ showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; render(); } };

  const saveUploadShort = document.getElementById('saveUploadShort');
  if(saveUploadShort) saveUploadShort.onclick = async ()=>{
    if(!pendingShortFile) return;
    const caption = (shortCaptionEl?.value || '').trim();
    try{
      shortUploadPct = 0; render();
      const src = await uploadToStorage(pendingShortFile.file, pct=>{
        shortUploadPct = pct;
        const bar = document.querySelector('#shortModalBack .upload-progress-bar');
        const lbl = document.querySelector('#shortModalBack .upload-label');
        if(bar) bar.style.width = pct+'%';
        if(lbl) lbl.textContent = 'Uploading… '+pct+'%';
      });
      const newShort = { author:ME.name, handle:ME.handle, caption, src, likes:0, comments:0, createdAt:Date.now() };
      let savedShortId = null;
      try{
        const res = await fbPost('shorts', newShort);
        savedShortId = res.name;
        shorts.unshift({ ...newShort, id:res.name });
        syncStatus='online';
      }catch(err){
        console.error(err);
        shorts.unshift({ ...newShort, id:'local-short-'+Date.now() });
        syncStatus='offline';
      }

      // Automatically cross-post every uploaded Short/video to the normal Posts feed.
      // The same Cloudinary URL is reused, so the video is uploaded only once.
      const autoPost = {
        author:ME.name,
        handle:ME.handle,
        createdAt:Date.now(),
        text:caption,
        mediaUrl:src,
        mediaType:'video',
        likes:0,
        autoFromShort:true,
        shortId:savedShortId || null
      };
      try{
        const postRes = await fbPost('posts', autoPost);
        posts.unshift({ ...autoPost, id:postRes.name, liked:false, comments:[] });
        syncStatus='online';
      }catch(err){
        console.error('Auto post failed:', err);
        posts.unshift({ ...autoPost, id:'local-auto-post-'+Date.now(), liked:false, comments:[] });
        syncStatus='offline';
      }

      showUploadShortModal=false; pendingShortFile=null; shortCaptionDraft=''; shortUploadPct=null;
      render();
    }catch(err){
      console.error(err);
      shortUploadPct=null;
      alert('Upload failed: '+err.message);
      render();
    }
  };

  document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{
    const s = suggestions.find(s=>s.handle===b.dataset.follow);
    s.following = !s.following;
    render();
  });

  const logoutBtn=document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.onclick=()=>firebaseAuth.signOut();
  const openEdit = document.getElementById('openEdit');
  if(openEdit) openEdit.onclick = ()=>{ showEditModal=true; showUploadShortModal=false; render(); };
  const openEditPhoto = document.getElementById('openEditPhoto');
  if(openEditPhoto) openEditPhoto.onclick = ()=>{ showEditModal=true; showUploadShortModal=false; render(); setTimeout(()=>document.getElementById('changePhotoBtn')?.click(),0); };
  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.onclick = ()=>{ showEditModal=false; render(); };

  const changePhotoBtn = document.getElementById('changePhotoBtn');
  const photoInput = document.getElementById('photoInput');
  if(changePhotoBtn) changePhotoBtn.onclick = ()=> photoInput.click();
  if(photoInput) photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    if(file.size > MAX_MEDIA_MB*1024*1024){
      alert(`That file is over ${MAX_MEDIA_MB}MB. Please pick something smaller.`);
      return;
    }
    try{
      photoUploadPct = 0; render();
      const url = await uploadToStorage(file, pct=>{ photoUploadPct = pct; const b=document.getElementById('changePhotoBtn'); if(b) b.textContent = `Uploading… ${pct}%`; });
      ME.photoUrl = url;
      photoUploadPct = null;
      render();
      try{ await fbPut(currentProfilePath(), ME); syncStatus='online'; }
      catch(err){ console.error(err); syncStatus='offline'; }
    }catch(err){
      console.error(err);
      photoUploadPct = null;
      alert('Photo upload failed: '+err.message);
      render();
    }
  };
  const saveEdit = document.getElementById('saveEdit');
  if(saveEdit) saveEdit.onclick = async ()=>{
    ME.name = document.getElementById('editName').value.trim() || ME.name;
    ME.bio = document.getElementById('editBio').value.trim();
    showEditModal = false;
    render();
    try{ await fbPut(currentProfilePath(), ME); syncStatus='online'; }
    catch(err){ console.error(err); syncStatus='offline'; }
    render();
  };
  const modalBack = document.getElementById('modalBack');
  if(modalBack) modalBack.onclick = (e)=>{ if(e.target.id==='modalBack'){ showEditModal=false; render(); } };
}

async function init(){
  await authReady;
  if(!firebaseUser) return;
  Object.assign(ME,userProfileDefaults());
  render(); // show something immediately (connecting…)
  // Reset the in-memory profile defaults for the authenticated account.
  Object.assign(ME, userProfileDefaults());
  await loadFromFirebase();
  render();
  // background sync: pull latest from Firebase periodically, but never while
  // someone is mid-typing or has a modal open, so we don't yank their input away
  setInterval(async ()=>{
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='TEXTAREA' || active.tagName==='INPUT');
    if(isTyping || showEditModal) return;
    await loadFromFirebase(true);
    render();
  }, 7000);
}
init();
</script>
</body>
</html>
